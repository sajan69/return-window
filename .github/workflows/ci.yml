name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: return_window
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: return_window
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U return_window"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://return_window:test-password@127.0.0.1:5432/return_window
      DJANGO_SECRET_KEY: ci-only-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy
        env:
          DJANGO_DEBUG: "false"
      - run: python manage.py test -v 2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run links

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: return_window
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: return_window_browser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U return_window"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://return_window:test-password@127.0.0.1:5432/return_window_browser
      DJANGO_SECRET_KEY: ci-browser-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test tests.browser_workflow -v 2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: return-window-browser
          path: artifacts/browser/*.png
          if-no-files-found: error
          retention-days: 7

  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: return_window
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: return_window_benchmark
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U return_window"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://return_window:test-password@127.0.0.1:5432/return_window_benchmark
      DJANGO_SECRET_KEY: ci-benchmark-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python manage.py migrate --noinput
      - run: python -m purchases.csv_benchmark --output artifacts/csv-benchmark.json
      - uses: actions/upload-artifact@v6
        with:
          name: return-window-csv-benchmark
          path: artifacts/csv-benchmark.json
          if-no-files-found: error
          retention-days: 7
