{% extends "base.html" %}
{% block content %}
<section class="card">
  <p class="eyebrow">Review required</p><h1>Confirm {{ rows|length }} purchases</h1>
  <div class="table-wrap"><table><thead><tr><th>Item</th><th>Store</th><th>Purchased</th><th>Return by</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.item_name }}</td><td>{{ row.store_name }}</td><td>{{ row.purchased_on }}</td><td>{{ row.return_by }}</td></tr>{% endfor %}</tbody></table></div>
  <form method="post" action="{% url 'purchase-import-confirm' %}">{% csrf_token %}<input type="hidden" name="token" value="{{ token }}"><div class="actions"><button>Import all purchases</button><a href="{% url 'purchase-import' %}">Cancel</a></div></form>
</section>
{% endblock %}
